name: Offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - run: node --test tests/test_established_route.cjs
      - name: JavaScript syntax
        run: find tools -name '*.cjs' -print0 | xargs -0 -n 1 node --check
